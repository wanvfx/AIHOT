# Optional: build & push multi-arch AIHOT images to your own registry.
# Copy this file to your AIHOT fork at  .github/workflows/docker-image.yml
# (it must sit at the repo root so context "." = the AIHOT source and ./Dockerfile exists).
# Then set the "Docker Image" field in the LuCI page to
#   ghcr.io/<your-github-username>/aihot:latest
name: docker-image

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ "v*" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aihot:latest
            ghcr.io/${{ github.repository_owner }}/aihot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
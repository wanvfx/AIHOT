# Build & push multi-arch AIHOT images.
# Copy to your AIHOT fork at .github/workflows/docker-image.yml (repo root; context "." + ./Dockerfile).
#
# Manual only: run from Actions -> docker-image -> "Run workflow". It does NOT auto-run on push/sync,
# so you choose when to cut a version (keeps versions clean and rollbackable).
#
# Each build is pushed to BOTH registries with 3 tags:
#   latest | the commit sha | a human-readable date tag YYYY-MM-DD-HHMM
# so you can pin/rollback the router by date (no GitHub Releases needed).
#   - ghcr.io/<owner>/aihot    (built-in GITHUB_TOKEN; always)
#   - docker.io/<user>/aihot   (Docker Hub, accelerated by iStoreOS iStoreEnhance)
#
# Docker Hub needs repo secret DOCKERHUB_TOKEN; optional var DOCKERHUB_USERNAME (if Hub user != owner).
name: docker-image

on:
  workflow_dispatch:
  tags: [ "v*" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Gate Docker Hub on whether its token secret exists, so ghcr still pushes without it.
      - name: Check Docker Hub creds
        id: dhc
        env:
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.dhc.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compose tags
        id: tags
        run: |
          owner="${{ github.repository_owner }}"
          ts="$(date -u +%Y-%m-%d-%H%M)"
          {
            echo "ghcr.io/$owner/aihot:latest"
            echo "ghcr.io/$owner/aihot:${{ github.sha }}"
            echo "ghcr.io/$owner/aihot:$ts"
            if [ "${{ steps.dhc.outputs.enabled }}" = "true" ]; then
              hub="${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}"
              echo "docker.io/$hub/aihot:latest"
              echo "docker.io/$hub/aihot:${{ github.sha }}"
              echo "docker.io/$hub/aihot:$ts"
            fi
          } > taglist.txt
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          cat taglist.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
